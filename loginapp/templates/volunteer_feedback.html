{% extends 'userbase.html' %}

{% block title %}Event Feedback{% endblock %}

{% set active_page = 'history' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Share Your Feedback</h4>
                </div>
                <div class="card-body">
                    <p class="mb-3">Event: <strong>{{ event_name }}</strong></p>
                    
                    <form method="post">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Rating</label>
                            <div class="d-flex gap-4">
                                {% for i in range(1,6) %}
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="rating" 
                                           id="rating{{ i }}" value="{{ i }}" required>
                                    <label class="form-check-label" for="rating{{ i }}">
                                        {{ i }} star{{ 's' if i > 1 }}
                                    </label>
                                </div>
                                {% endfor %}
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="comments" class="form-label fw-bold">Comments</label>
                            <textarea class="form-control" id="comments" name="comments" 
                                      rows="4" placeholder="Tell us about your experience..."></textarea>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">Submit Feedback</button>
                            <a href="{{ url_for('volunteer_history') }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
            
            <div class="text-center mt-3 text-muted small">
                <p>Your feedback helps us improve future events!</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
