<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EcoCleanUp - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e8f0e8 100%);
            min-height: 100vh;
        }
        .login-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .login-header {
            background: linear-gradient(135deg, #2c5e2e 0%, #3b7a3d 100%);
            color: white;
            border-radius: 15px 15px 0 0;
            padding: 2rem;
        }
        .login-header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 600;
        }
        .login-body {
            padding: 2.5rem;
            background: white;
            border-radius: 0 0 15px 15px;
        }
        .btn-login {
            background: #2c5e2e;
            color: white;
            padding: 0.8rem;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background: #1e4a20;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(44,94,46,0.3);
        }
        .footer-link {
            color: #2c5e2e;
            text-decoration: none;
            font-weight: 500;
        }
        .footer-link:hover {
            text-decoration: underline;
        }
        .environment-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(44,94,46,0.1);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            color: #2c5e2e;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row vh-100 align-items-center justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="login-card">
                    <div class="login-header text-center">
                        <h1>🌱 EcoCleanUp</h1>
                        <p class="mb-0 opacity-75">Community Cleanup Management</p>
                    </div>
                    
                    <div class="login-body">
                        <form action="{{ url_for('login') }}" method="post">
                            <div class="mb-4">
                                <label for="username" class="form-label fw-semibold">Username</label>
                                <input type="text" 
                                       class="form-control form-control-lg {% if username_invalid %}is-invalid{% endif %}" 
                                       id="username" 
                                       name="username" 
                                       placeholder="Enter your username..." 
                                       value="{{ username }}" 
                                       required>
                                <div class="invalid-feedback">Account not found</div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input type="password" 
                                       class="form-control form-control-lg {% if password_invalid %}is-invalid{% endif %}" 
                                       id="password" 
                                       name="password" 
                                       placeholder="Enter your password..." 
                                       required>
                                <div class="invalid-feedback">Incorrect password</div>
                            </div>
                            
                            <div class="d-grid gap-2 mb-4">
                                <button type="submit" class="btn btn-login btn-lg">Log In</button>
                            </div>
                            
                            <div class="text-center">
                                <p class="text-muted mb-0">
                                    New to EcoCleanUp? 
                                    <a href="{{ url_for('signup') }}" class="footer-link">Create an account</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div class="text-center mt-4 text-muted small">
                    <p>© 2026 Liying Yu - 1161457 | COMP639 Project</p>
                </div>
            </div>
        </div>
    </div>
    
    <div class="environment-badge">
        🌿 Making a difference together
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
