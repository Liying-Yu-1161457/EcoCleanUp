<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EcoCleanUp - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="row vh-100 align-items-center justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-header bg-success text-white text-center">
                        <h3>EcoCleanUp</h3>
                    </div>
                    
                    <div class="card-body">
                        <form action="{{ url_for('login') }}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" 
                                       class="form-control {% if username_invalid %}is-invalid{% endif %}" 
                                       name="username" 
                                       value="{{ username }}" 
                                       required>
                                {% if username_invalid %}
                                <div class="invalid-feedback">Account not found</div>
                                {% endif %}
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" 
                                       class="form-control {% if password_invalid %}is-invalid{% endif %}" 
                                       name="password" 
                                       required>
                                {% if password_invalid %}
                                <div class="invalid-feedback">Wrong password</div>
                                {% endif %}
                            </div>
                            
                            <button type="submit" class="btn btn-success w-100 mb-3">Log In</button>
                            
                            <div class="text-center">
                                <a href="{{ url_for('signup') }}">Create an account</a>
                            </div>
                        </form>
                    </div>
                    
                    <div class="card-footer text-center text-muted small">
                        Liying Yu - 1161457 | COMP639 2026
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
